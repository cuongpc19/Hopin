[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Content-hashed bundles never change under the same name — cache them forever so
# repeat visits (and returns after a level) don't re-download the 1.8MB engine.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Art keeps stable names, so revalidate but still cache for a week.
[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
