<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- iOS "Add to Home Screen" caches index.html very aggressively in its own
         web-clip storage, so it keeps pointing at the OLD hashed bundle and never
         picks up a new deploy. These force the HTML to always revalidate so the
         home-screen app loads the latest bundle like the Safari tab does. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Hop In!</title>
    <!-- Fetch the splash poster in parallel with the JS bundle so it's already
         cached by the time Phaser boots — the splash then appears the instant the
         engine is ready instead of after a second round-trip. -->
    <link rel="preload" as="image" href="art/hopin2.jpg" />
    <!-- Font tròn-mập kiểu game (Lilita One, OFL) cho banner LEVEL COMPLETE!/CLAIM —
         bundle nội bộ, preload + @font-face để canvas Phaser có sẵn lúc vẽ text. -->
    <link rel="preload" as="font" type="font/ttf" href="fonts/LilitaOne.ttf" crossorigin />
    <style>
      @font-face {
        font-family: "Lilita One";
        src: url("fonts/LilitaOne.ttf") format("truetype");
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* Match the game's base color so the FIT letterbox bars (top/bottom on
           tall screens) blend in instead of showing as a bare white strip. */
        background: #bfe3a0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Fill the viewport and let Phaser's CENTER_BOTH do the centering.
         (Using flex here as well would double-center and shift the canvas.) */
      #game {
        position: absolute;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      /* Instant boot screen — pure HTML/CSS so it paints in the first frame,
         before the 1.8MB Phaser bundle finishes downloading/compiling. Removed
         from JS (SplashScene.create) once the real poster is ready, so there's
         no blank stall at launch. */
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #bfe3a0;
        font-family: Arial, sans-serif;
        z-index: 10;
        transition: opacity 0.3s ease;
      }
      #boot.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot .title {
        font-size: 44px;
        font-weight: 800;
        color: #fff;
        -webkit-text-stroke: 2px #5a3a12;
        text-shadow: 0 3px 0 #5a3a12;
        letter-spacing: 1px;
        animation: bootPulse 1s ease-in-out infinite;
      }
      #boot .dots {
        display: flex;
        gap: 10px;
      }
      #boot .dots span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #6a4a12;
        animation: bootBounce 0.9s ease-in-out infinite;
      }
      #boot .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      #boot .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bootPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes bootBounce {
        0%, 100% { transform: translateY(0); opacity: 0.5; }
        50% { transform: translateY(-10px); opacity: 1; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Dr5PIMqs.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">
      <div class="title">Hop In!</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </body>
</html>
